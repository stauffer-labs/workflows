# Reusable CI for Java projects built with Maven.
name: java-ci

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing pom.xml
        type: string
        default: "."
      java-versions:
        description: JSON list of Java versions to test against
        type: string
        default: '["21", "25"]'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ${{ fromJSON(inputs.java-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven
      - run: mvn -B verify
